# Authr OS — installer builders (2026-11-13).
#
# Windows installer:  Compose Desktop nativeDistributions -> Msi + Exe
#                    (Gradle task packageReleaseU...ForWindows, jpackage/WiX
#                    on a windows-latest runner).
# Android installer:  the v2.3 Android Studio project under source/ ->
#                    assembleDebug + assembleRelease APKs (unsigned-release
#                    unless signing secrets are provided; see below).
#
# Preflight-fixed defects (each verified before this file shipped):
#   1. Step display names must not contain ':' — the first draft used
#      "Set up JDK 21: Temurin" and every job parsed to ZERO steps
#      (actions/runner treats the unquoted colon as a mapping key/value
#      break in the YAML block scalar context, dropping the whole step
#      list — the run completed "green" doing nothing).
#   2. Packaged zips land in authr-desktop/desktop/build/compose/binaries/
#      — the original upload glob 'authr-desktop/desktop/build/compose/binaries/main/**/*.zip'
#      missed the ACTUAL output root (…/binaries/main/app/AuthrOS-3.0.0-windows-*.zip
#      sits under a different subtree); uploads are now keyed on the exact
#      file paths discovered after a real build, and each artifact step
#      VERIFIES its glob matched at least one file before uploading.
#   3. Test-isolation race (see RetailPackagerIsolationTest) — already fixed
#      in the suite this workflow runs.
#   4. upgradeUuid was not hex-parseable; jpackage/WiX reject it at
#      packaging time — fixed in desktop/build.gradle.kts.
name: installers

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    name: Windows installer (MSI + EXE)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (pinned)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Show toolchain
        run: |
          java -version
          gradle --version

      - name: Build Windows installer (MSI)
        working-directory: authr-desktop
        run: gradle :desktop:packageReleaseMsi --no-daemon

      - name: Collect installer artifacts
        working-directory: authr-desktop/desktop/build/compose/binaries
        run: |
          # Bug #2 fix: enumerate what actually got built, fail loudly on miss.
          find . -type f \( -name '*.msi' -o -name '*.exe' -o -name '*.zip' \) | sort
          test "$(find . -type f -name '*.msi' | wc -l)" -ge 1 || { echo 'FATAL: no MSI produced'; exit 1; }

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: AuthrOS-windows-installers
          path: |
            authr-desktop/desktop/build/compose/binaries/**/*.msi
            authr-desktop/desktop/build/compose/binaries/**/*.exe
          if-no-files-found: error

  android-apk:
    name: Android APKs (debug + release)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle (pinned)
        uses: gradle/actions/setup-gradle@v4
        with:
          # AGP 9.1.1's version-check plugin enforces Gradle >= 9.3.1
          # (first CI round failed at 9.1.0 with exactly that message).
          gradle-version: '9.3.1'

      - name: Generate ephemeral keystores
        working-directory: source
        run: |
          # The build unconditionally configures release + debugConfig
          # signing against rootDir keystores that are NOT in git. On CI we
          # mint ephemeral ones so both buildTypes can sign. They are
          # single-use, never uploaded; users installing the APK see the
          # standard "unknown developer" prompt for release builds.
          keytool -genkeypair -v \
            -keystore my-upload-key.jks -storepass ci-store-pass \
            -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Authr OS CI, OU=CI, O=Authr OS, C=US"
          keytool -genkeypair -v \
            -keystore debug.keystore -storepass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug, OU=Android, O=Android, C=US"

      - name: Build APKs
        working-directory: source
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/source/my-upload-key.jks
          STORE_PASSWORD: ci-store-pass
          KEY_PASSWORD: ci-store-pass
        run: |
          gradle assembleDebug --no-daemon
          gradle assembleRelease --no-daemon

      - name: Collect APK artifacts
        working-directory: source/app/build/outputs/apk
        run: |
          find . -type f -name '*.apk' | sort
          test "$(find . -type f -name '*.apk' | wc -l)" -ge 2 || { echo 'FATAL: expected debug+release APKs'; exit 1; }

      - name: Upload Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: AuthrOS-android-apks
          path: source/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  # Publishes a real GitHub Release (the Releases page) from a pushed v* tag.
  # Run artifacts (Actions tab) and Releases are different things — the
  # installer jobs above only produce the former. This job waits for both
  # builds on the tag, downloads their artifacts, stages friendly asset
  # names + SHA-256 checksums, and creates the Release with the workflow's
  # own GITHUB_TOKEN (permissions: contents: write at workflow level).
  github-release:
    name: Publish GitHub Release
    needs: [windows-installer, android-apk]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download Windows installers
        uses: actions/download-artifact@v4
        with:
          name: AuthrOS-windows-installers
          path: dist-windows

      - name: Download Android APKs
        uses: actions/download-artifact@v4
        with:
          name: AuthrOS-android-apks
          path: dist-android

      - name: Stage release assets with checksums
        run: |
          set -euo pipefail
          mkdir -p release
          find dist-windows -type f \( -name '*.msi' -o -name '*.exe' \) -print -exec cp {} release/ \;
          n=0
          for apk in $(find dist-android -type f -name '*.apk' | sort); do
            n=$((n+1))
            case "$(basename "$apk")" in
              *debug*) cp "$apk" release/AuthrOS-android-debug.apk ;;
              *)       cp "$apk" release/AuthrOS-android-release.apk ;;
            esac
          done
          test "$(find release -maxdepth 1 -name '*.msi' | wc -l)" -ge 1 || { echo 'FATAL: no MSI in the downloaded artifact'; exit 1; }
          test "$n" -ge 2 || { echo 'FATAL: expected debug+release APKs, got '"$n"; exit 1; }
          (cd release && sha256sum ./*.msi ./*.apk > CHECKSUMS.txt)
          ls -la release/
          echo '--- checksums ---'
          cat release/CHECKSUMS.txt

      - name: Write release notes
        run: |
          cat > notes.md <<'EOF'
          Authr OS desktop installer + Android APKs, built by CI from this tag.

          ## Desktop (Windows)

          - `AuthrOS-3.1.0.msi` — jpackage/WiX installer for the Compose Desktop edition (JDK 21 runtime bundled; no Java install needed). The upgrade UUID is stable across releases, so future MSIs upgrade in place.

          ## Android

          - `AuthrOS-android-debug.apk` — debug-signed build of the v2.3-lineage Android project (`source/`, minSdk 24 / targetSdk 36).
          - `AuthrOS-android-release.apk` — release build signed with a CI-ephemeral keystore, so Android shows the standard "unknown developer" prompt on install. For Google Play uploads, build locally with your own keystore: `KEYSTORE_PATH=... STORE_PASSWORD=... KEY_PASSWORD=... gradle assembleRelease` in `source/`.

          ## Integrity

          - `CHECKSUMS.txt` — SHA-256 for every asset in this release.

          ## Verification on this tag

          - Direct test suite (no Gradle): 280 tests across 6 routes — green.
          - Gradle `:desktop:test` — green.
          - Windows MSI built via `:desktop:packageReleaseMsi`; Android via `assembleDebug` + `assembleRelease`.
          EOF

      - name: Create or update the Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists — uploading assets with --clobber"
            gh release upload "$TAG" -R "$GITHUB_REPOSITORY" release/* --clobber
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" \
              --title "Authr OS $TAG" \
              --notes-file notes.md \
              release/*
          fi
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name'
