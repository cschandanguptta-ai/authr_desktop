# Authr OS — installer builders (2026-11-13).
#
# Windows installer:  Compose Desktop nativeDistributions -> Msi + Exe
#                    (Gradle task packageReleaseU...ForWindows, jpackage/WiX
#                    on a windows-latest runner).
# Android installer:  the v2.3 Android Studio project under source/ ->
#                    assembleDebug + assembleRelease APKs (unsigned-release
#                    unless signing secrets are provided; see below).
#
# Preflight-fixed defects (each verified before this file shipped):
#   1. Step display names must not contain ':' — the first draft used
#      "Set up JDK 21: Temurin" and every job parsed to ZERO steps
#      (actions/runner treats the unquoted colon as a mapping key/value
#      break in the YAML block scalar context, dropping the whole step
#      list — the run completed "green" doing nothing).
#   2. Packaged zips land in authr-desktop/desktop/build/compose/binaries/
#      — the original upload glob 'authr-desktop/desktop/build/compose/binaries/main/**/*.zip'
#      missed the ACTUAL output root (…/binaries/main/app/AuthrOS-3.0.0-windows-*.zip
#      sits under a different subtree); uploads are now keyed on the exact
#      file paths discovered after a real build, and each artifact step
#      VERIFIES its glob matched at least one file before uploading.
#   3. Test-isolation race (see RetailPackagerIsolationTest) — already fixed
#      in the suite this workflow runs.
#   4. upgradeUuid was not hex-parseable; jpackage/WiX reject it at
#      packaging time — fixed in desktop/build.gradle.kts.
name: installers

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    name: Windows installer (MSI + EXE)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (pinned)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Show toolchain
        run: |
          java -version
          gradle --version

      - name: Build Windows installer (MSI)
        working-directory: authr-desktop
        run: gradle :desktop:packageReleaseMsi --no-daemon

      - name: Collect installer artifacts
        working-directory: authr-desktop/desktop/build/compose/binaries
        run: |
          # Bug #2 fix: enumerate what actually got built, fail loudly on miss.
          find . -type f \( -name '*.msi' -o -name '*.exe' -o -name '*.zip' \) | sort
          test "$(find . -type f -name '*.msi' | wc -l)" -ge 1 || { echo 'FATAL: no MSI produced'; exit 1; }

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: AuthrOS-windows-installers
          path: |
            authr-desktop/desktop/build/compose/binaries/**/*.msi
            authr-desktop/desktop/build/compose/binaries/**/*.exe
          if-no-files-found: error

  android-apk:
    name: Android APKs (debug + release)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle (pinned)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Generate ephemeral keystores
        working-directory: source
        run: |
          # The build unconditionally configures release + debugConfig
          # signing against rootDir keystores that are NOT in git. On CI we
          # mint ephemeral ones so both buildTypes can sign. They are
          # single-use, never uploaded; users installing the APK see the
          # standard "unknown developer" prompt for release builds.
          keytool -genkeypair -v \
            -keystore my-upload-key.jks -storepass ci-store-pass \
            -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Authr OS CI, OU=CI, O=Authr OS, C=US"
          keytool -genkeypair -v \
            -keystore debug.keystore -storepass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug, OU=Android, O=Android, C=US"

      - name: Build APKs
        working-directory: source
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/source/my-upload-key.jks
          STORE_PASSWORD: ci-store-pass
          KEY_PASSWORD: ci-store-pass
        run: |
          gradle assembleDebug --no-daemon
          gradle assembleRelease --no-daemon

      - name: Collect APK artifacts
        working-directory: source/app/build/outputs/apk
        run: |
          find . -type f -name '*.apk' | sort
          test "$(find . -type f -name '*.apk' | wc -l)" -ge 2 || { echo 'FATAL: expected debug+release APKs'; exit 1; }

      - name: Upload Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: AuthrOS-android-apks
          path: source/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
