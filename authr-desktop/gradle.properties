# Authr Desktop build tuning for constrained environments
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=640m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true
org.gradle.configuration-cache=false
kotlin.code.style=official
kotlin.incremental=true
# Suppress experimental warnings noise
kotlin.mpp.stability.nowarn=true
org.jetbrains.compose.experimental.uikit.isEnabled=true

# Pin the toolchain to the locally installed JDK 21 (no auto-provisioning
# in sandboxed environments — see root build.gradle.kts note).
org.gradle.java.installations.paths=/tmp/my-project/tools/jdk,/usr/lib/jvm/java-21-openjdk-amd64
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=false

# Compose jlink/jpackage need a full JDK (jlink missing from the system JRE);
# point Gradle's own JVM at the sandbox's full JDK 21.
org.gradle.java.home=/tmp/my-project/tools/jdk
